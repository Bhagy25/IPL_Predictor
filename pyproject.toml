[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cricketlens"
version = "0.1.0"
description = "EDA-first men's IPL analytics and probability prediction"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0,<3",
    # models/*.joblib were serialised with scikit-learn 1.8.0; other versions warn on load.
    "scikit-learn==1.8.0",
    "joblib>=1.2,<2",
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "matplotlib>=3.7,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7,<10", "matplotlib>=3.7,<4", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
